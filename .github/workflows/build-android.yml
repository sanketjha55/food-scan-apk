name: Build Android APK & iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android & iOS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean assembleRelease -x test --debug > build.log 2>&1
          build_exit_code=$?
          tail -100 build.log
          exit $build_exit_code
      
      - name: Check Build Output
        run: |
          echo "=== Checking APK Output Directory ==="
          find . -type f -name "*.apk" | head -20 || echo "No APK files found"
          echo ""
          echo "=== Full android/app/build structure ==="
          ls -R android/app/build/outputs/ 2>/dev/null || echo "outputs directory not found"

      - name: Upload Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/**/build/outputs/**/*.apk
            android/**/build/outputs/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: List APK Files
        run: |
          echo "=== APK Files Generated ==="
          find android -name "*.apk" -o -name "*.aab" 2>/dev/null | head -20
          echo "=== Build Complete ==="
